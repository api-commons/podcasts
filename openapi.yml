openapi: 3.1.0
info:
  title: Podcasts (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Podcasts interface, distilled from the harvested OpenAPI of 88 providers in the APIs.io
    catalog. Not a product: no one serves this API. It is the shape the market already shares, measured, so that
    providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /shows:
    get:
      operationId: listShows
      summary: List shows
      tags:
      - Shows
      x-commons-tier: core
      x-commons-share: 0.846
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Show'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createShow
      summary: Create a show
      tags:
      - Shows
      x-commons-tier: extended
      x-commons-share: 0.385
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /shows/{show_id}:
    parameters:
    - $ref: '#/components/parameters/show_id'
    get:
      operationId: getShow
      summary: Get a show
      tags:
      - Shows
      x-commons-tier: core
      x-commons-share: 0.692
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
  /episodes:
    get:
      operationId: listEpisodes
      summary: List episodes
      tags:
      - Episodes
      x-commons-tier: core
      x-commons-share: 0.909
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id002
                  $ref: '#/components/schemas/Episode'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createEpisode
      summary: Create an episode
      tags:
      - Episodes
      x-commons-tier: core
      x-commons-share: 0.727
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
  /episodes/{episode_id}:
    parameters:
    - $ref: '#/components/parameters/episode_id'
    get:
      operationId: getEpisode
      summary: Get an episode
      tags:
      - Episodes
      x-commons-tier: core
      x-commons-share: 0.818
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
    patch:
      operationId: updateEpisode
      summary: Update an episode
      tags:
      - Episodes
      x-commons-tier: extended
      x-commons-share: 0.364
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
components:
  schemas:
    Show:
      $ref: ./schema/show.json
    Episode:
      $ref: ./schema/episode.json
  parameters:
    show_id:
      name: show_id
      in: path
      required: true
      schema:
        type: string
    episode_id:
      name: episode_id
      in: path
      required: true
      schema:
        type: string
